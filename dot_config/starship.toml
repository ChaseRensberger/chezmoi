"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = '$username$hostname$directory$git_branch${custom.git_dirty} $character'

[username]
show_always = true
style_user = 'dimmed white'
style_root = 'red'
format = '[$user]($style)@'

[hostname]
ssh_only = false
style = 'dimmed white'
format = '[$hostname]($style) '

[directory]
truncation_length = 0
truncate_to_repo = false
style = 'cyan'
format = '[$path]($style)'

[git_branch]
style = 'dimmed white'
format = ' [$branch]($style)'

# Show exactly one marker for any local Git changes.
[custom.git_dirty]
require_repo = true
shell = ['sh']
when = 'test -n "$(git --no-optional-locks status --porcelain --untracked-files=normal 2>/dev/null)"'
format = '[*](yellow)'

[character]
success_symbol = '[>](dimmed white)'
error_symbol = '[>](red)'
vimcmd_symbol = '[<](dimmed white)'
